<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><b>Student Registration Form</b></title>
</head>
<body>
    <h1 align="center"><b>Student Registration Form</b></h1>
    <form>
        <table border="1" cellpadding="10" cellspacing="0" align="centre"> </table>
        <h1 align="centre">Registration form</h1>
        <tr>
            <th colspan="2" align="center">Registration Form</th>
        </tr>

        <tr>
            <td>Full Name</td>
            <td>
                <input type="text" placeholder="Enter your name"
            </td>
            
        </tr>
        

        <tr>
            <td>Email</td>
            <td>
                <input type="text" placeholder="abc@gmail.com"
            </td>
        </tr>

        <tr>
            <td>phone number </td>
            <td>
                <input type="number" placeholde="897856483"
            </td>
        </tr>
        <tr>
            <td>Date of birth</td>
            <td>
                <input type="date" 
            </td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="male">
                <input type="radio" name="female">
                <input type="radio" name="others">
            </td>
        </tr>

        <tr>
            <td>skills</td>
            <input type="checkbox" name="html">
            <input type="checkbox" name="css">
            <input type="checkbox" name="js">
        </tr>
        <tr>
            <td>Course</td>
            <td>
                <select>
                    <option>btech</option>
                    <option>mba</option>
                    <option>bba</option>
                    <option>bca</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>address </td>
            <textarea text="5" cols="30" ></textarea>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>

        <iframe src="https://in.pinterest.com/" width="100%" height="500px" ></iframe>
         <h1> style=background-color: lightblue/h1>
    </form>
</body>
</html>
