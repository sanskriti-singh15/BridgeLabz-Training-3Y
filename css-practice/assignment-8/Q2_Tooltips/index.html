<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tooltips</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>CSS Tooltip Demonstration</h1></header>
<main class="tooltip-container">
  <div class="tooltip-item">HTML<span class="tooltip">HyperText Markup Language</span></div>
  <div class="tooltip-item">CSS<span class="tooltip">Cascading Style Sheets</span></div>
  <div class="tooltip-item">Grid<span class="tooltip">CSS Grid Layout</span></div>
  <div class="tooltip-item">Flexbox<span class="tooltip">Flexible Box Layout</span></div>
</main>
<footer><p>Hover over each word to view its tooltip.</p></footer>
</body></html>
