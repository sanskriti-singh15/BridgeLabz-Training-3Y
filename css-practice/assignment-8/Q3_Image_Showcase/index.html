<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Image Showcase</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Image Showcase</h1></header>
<main class="gallery">
  <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=1" alt="Nature"><div class="overlay"></div></div><figcaption>Nature</figcaption></figure>
  <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=2" alt="Architecture"><div class="overlay"></div></div><figcaption>Architecture</figcaption></figure>
  <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=3" alt="Travel"><div class="overlay"></div></div><figcaption>Travel</figcaption></figure>
  <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=4" alt="City"><div class="overlay"></div></div><figcaption>City</figcaption></figure>
  <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=5" alt="Mountains"><div class="overlay"></div></div><figcaption>Mountains</figcaption></figure>
  <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=6" alt="Ocean"><div class="overlay"></div></div><figcaption>Ocean</figcaption></figure>
</main>
<footer><p>Responsive image gallery</p></footer>
</body></html>
