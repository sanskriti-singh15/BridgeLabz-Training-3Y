<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Box Sizing</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Box-Sizing Comparison</h1></header>
<main class="comparison">
<section><h2>Default</h2><div class="box content-box">Width: 250px + padding + border</div><p>With content-box, padding and border are added to the declared width.</p></section>
<section><h2>Border Box</h2><div class="box border-box">Total width stays 250px</div><p>With border-box, padding and border are included inside the declared width.</p></section>
</main>
<footer><p>Responsive comparison</p></footer>
</body></html>
