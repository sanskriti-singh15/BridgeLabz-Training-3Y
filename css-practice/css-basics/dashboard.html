<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        /* Fixed Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #172554;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 25px;
            z-index: 1000;
        }

        header h1 {
            font-size: 1.8rem;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 70px;
            left: 0;
            width: 220px;
            height: calc(100vh - 70px);
            background-color: #1e293b;
            padding: 25px 15px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background-color: #334155;
        }

        /* Main Content */
        main {
            margin-left: 220px;
            padding: 110px 30px 30px;
        }

        .content {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .box {
            flex: 1;
            min-width: 250px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .box h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        .box p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 700px) {

            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                margin-top: 70px;
            }

            main {
                margin-left: 0;
                padding-top: 30px;
            }

            header {
                position: fixed;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <aside class="sidebar">

        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Projects</a>
        <a href="#">Messages</a>
        <a href="#">Settings</a>

    </aside>

    <main>

        <div class="content">

            <div class="box">
                <h2>Total Projects</h2>
                <p>12 completed projects</p>
            </div>

            <div class="box">
                <h2>Tasks</h2>
                <p>24 tasks completed this month</p>
            </div>

            <div class="box">
                <h2>Messages</h2>
                <p>8 new messages received</p>
            </div>

        </div>

    </main>

</body>
</html>
