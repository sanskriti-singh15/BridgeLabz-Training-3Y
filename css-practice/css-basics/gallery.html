<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        /* Gallery Grid */
        .gallery {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* Image Card */
        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            height: 250px;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        /* Caption Overlay */
        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* Hover Effect */
        .photo:hover img {
            transform: scale(1.1);
        }

        .photo:hover .caption {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
            <div class="caption">Beautiful Mountain</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1016/600/400" alt="Nature">
            <div class="caption">Peaceful Nature</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1018/600/400" alt="Landscape">
            <div class="caption">Amazing Landscape</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1025/600/400" alt="Animal">
            <div class="caption">Cute Animal</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1035/600/400" alt="Beach">
            <div class="caption">Beautiful Beach</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1043/600/400" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

    </div>

</body>
</html>
