<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <h3>Card Title</h3>
                    <img src="https://via.placeholder.com/250x150" alt="Placeholder">
                </div>
                <div class="flip-card-back">
                    <h3>Description</h3>
                    <p>This is the back side of the card showing detailed text description after flipping 180 degrees.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
