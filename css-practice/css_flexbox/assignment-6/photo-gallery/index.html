<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="gallery-container">
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Nature View">
            <figcaption>Nature View</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Cityscape">
            <figcaption>Cityscape</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Mountain Peak">
            <figcaption>Mountain Peak</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Ocean Sunset">
            <figcaption>Ocean Sunset</figcaption>
        </figure>
    </main>
</body>
</html>
