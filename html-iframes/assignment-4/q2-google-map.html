<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <h1>My University Location</h1>

    <!-- loading="lazy" loads the map only when it is needed -->
    <iframe
        src="https://www.google.com/maps?q=GLA+University+Mathura&output=embed"
        title="GLA University Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
